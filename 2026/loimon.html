<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Thời Gian Di Chuyển - 80km</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #4e54c8;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        
        .content {
            padding: 30px;
        }
        
        .route-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
        }
        
        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 500;
            color: #555;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #4e54c8;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: #4e54c8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #3b41a8;
            transform: translateY(-2px);
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 12px;
            border-left: 6px solid #4caf50;
            display: none;
            font-size: 20px;
            line-height: 1.6;
        }
        
        .time-big {
            font-size: 42px;
            font-weight: 700;
            color: #2e7d32;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛣️ Tính Thời Gian Di Chuyển</h1>
            <p>Quãng đường 80km (2 chiều = 160km)</p>
        </div>
        
        <div class="content">
            <div class="route-info">
                <strong>Quãng đường một chiều:</strong> 80 km<br>
                <strong>Tổng quãng đường 2 chiều:</strong> <span style="color:#4e54c8; font-size:22px;">160 km</span>
            </div>

            <label for="speed">🚗 Tốc độ trung bình (km/h)</label>
            <input type="number" id="speed" value="60" min="10" max="150" step="5">

            <label for="break">⏸️ Thời gian nghỉ giữa 2 chiều (phút)</label>
            <input type="number" id="break" value="30" min="0" max="120">

            <button onclick="calculateTime()">TÍNH THỜI GIAN</button>

            <div id="result" class="result">
                <strong>Kết quả:</strong><br><br>
                <span id="time_one"></span><br>
                <span id="time_total"></span><br><br>
                <strong>Thời gian nghỉ:</strong> <span id="break_time"></span>
            </div>
        </div>
        
        <footer>
            Dễ nhìn • Tính nhanh • Dành cho người Việt 🇻🇳
        </footer>
    </div>

    <script>
        function calculateTime() {
            const speed = parseFloat(document.getElementById('speed').value);
            const breakMin = parseFloat(document.getElementById('break').value) || 0;
            
            if (!speed || speed <= 0) {
                alert("Vui lòng nhập tốc độ hợp lệ!");
                return;
            }

            const distance_one = 80;           // km một chiều
            const distance_total = 160;        // km hai chiều

            const time_one_hours = distance_one / speed;
            const time_total_hours = distance_total / speed;

            // Chuyển sang giờ và phút
            const time_one_h = Math.floor(time_one_hours);
            const time_one_m = Math.round((time_one_hours - time_one_h) * 60);

            const time_total_h = Math.floor(time_total_hours);
            const time_total_m = Math.round((time_total_hours - time_total_h) * 60);

            const break_h = Math.floor(breakMin / 60);
            const break_m = breakMin % 60;

            // Hiển thị kết quả
            document.getElementById('time_one').innerHTML = 
                `⏱️ Một chiều (80km): <span class="time-big">${time_one_h}h ${time_one_m}p</span>`;

            document.getElementById('time_total').innerHTML = 
                `🛣️ Tổng di chuyển (160km): <span class="time-big">${time_total_h}h ${time_total_m}p</span>`;

            document.getElementById('break_time').innerHTML = 
                `${break_h > 0 ? break_h + 'h ' : ''}${break_m}p`;

            document.getElementById('result').style.display = 'block';
        }

        // Tính ngay khi tải trang với tốc độ mặc định 60km/h
        window.onload = () => {
            calculateTime();
        };
    </script>
</body>
</html>
