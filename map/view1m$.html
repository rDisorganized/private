<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KCN Mobile - Chọn Khu Công Nghiệp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        
        .header {
            background: #007bff;
            color: white;
            padding: 12px 15px;
            text-align: center;
            font-size: 18px;
            position: relative;
            z-index: 1000;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 56px);
        }
        
        #map {
            flex: 1;
            width: 100%;
        }
        
        .panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-height: 45vh;
            overflow: hidden;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .panel-header {
            padding: 12px 15px;
            background: #f1f1f1;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .list-container {
            max-height: 35vh;
            overflow-y: auto;
            padding: 8px;
        }
        
        .kcn-item {
            padding: 12px 15px;
            margin: 6px 0;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            cursor: pointer;
            font-size: 15px;
        }
        
        .kcn-item:hover, .kcn-item:active {
            background: #e3f2fd;
        }
        
        .controls {
            position: absolute;
            top: 70px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        button {
            padding: 10px 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .small-btn {
            padding: 8px 12px;
            font-size: 14px;
        }
        
        #status {
            position: absolute;
            top: 70px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <strong>Chọn Khu Công Nghiệp</strong>
    </div>

    <div class="container">
        <div id="map"></div>
    </div>

    <!-- Panel danh sách -->
    <div class="panel" id="panel">
        <div class="panel-header" onclick="togglePanel()">
            📋 Danh sách Khu Công Nghiệp (<span id="count">0</span>)
            <span id="toggle-icon">▼</span>
        </div>
        <div class="list-container" id="list"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="locateUser()" class="small-btn">📍 Vị trí của tôi</button>
        <button onclick="resetView()" class="small-btn">🌍 Reset bản đồ</button>
    </div>

    <div id="status"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ==================== FIREBASE ====================
        const firebaseConfig = {
            databaseURL: "https://bankvanhungbian-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('khu_cong_nghiep');

        // ==================== BẢN ĐỒ ====================
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: true
        }).setView([10.8231, 106.6297], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markers = {};
        let isPanelOpen = true;

        // ==================== TẢI DANH SÁCH ====================
        function loadList() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';

            dbRef.on('value', (snapshot) => {
                listDiv.innerHTML = '';
                markers = {};
                let count = 0;

                snapshot.forEach((child) => {
                    const key = child.key;
                    const data = child.val();
                    if (!data.lat || !data.lng) return;

                    count++;

                    // Marker trên bản đồ
                    const marker = L.marker([data.lat, data.lng], {
                        riseOnHover: true
                    }).addTo(map);
                    
                    marker.bindPopup(`
                        <b>${data.ten}</b><br>
                        Lat: ${data.lat.toFixed(6)}<br>
                        Lng: ${data.lng.toFixed(6)}
                    `);

                    markers[key] = marker;

                    // Item trong danh sách (click để chọn + zoom đến)
                    const div = document.createElement('div');
                    div.className = 'kcn-item';
                    div.innerHTML = `
                        <strong>${data.ten}</strong><br>
                        <small>${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}</small>
                    `;
                    div.onclick = () => {
                        map.flyTo([data.lat, data.lng], 15, { duration: 1.5 });
                        marker.openPopup();
                    };
                    listDiv.appendChild(div);
                });

                document.getElementById('count').textContent = count;
            });
        }

        // Toggle panel (thu gọn / mở rộng)
        function togglePanel() {
            isPanelOpen = !isPanelOpen;
            const panel = document.getElementById('panel');
            const icon = document.getElementById('toggle-icon');
            if (isPanelOpen) {
                panel.style.maxHeight = '45vh';
                icon.textContent = '▼';
            } else {
                panel.style.maxHeight = '50px';
                icon.textContent = '▲';
            }
        }

        // ==================== CHỨC NĂNG KHÁC ====================
        function locateUser() {
            if (!navigator.geolocation) {
                showStatus("Trình duyệt không hỗ trợ định vị", "red");
                return;
            }
            showStatus("Đang lấy vị trí...", "blue");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.flyTo([lat, lng], 14);
                    showStatus("Đã đến vị trí của bạn", "green");
                },
                () => showStatus("Không lấy được vị trí", "red")
            );
        }

        function resetView() {
            map.flyTo([10.8231, 106.6297], 11);
        }

        function showStatus(text, color = "blue") {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.color = color === "red" ? "#ff4444" : (color === "green" ? "#4caf50" : "#2196f3");
            status.style.display = "block";
            setTimeout(() => status.style.display = "none", 3000);
        }

        // Khởi động
        window.onload = () => {
            loadList();
            // Fix Leaflet trên mobile (đôi khi icon bị lệch)
            setTimeout(() => map.invalidateSize(), 300);
        };

        // Tự động invalidate size khi xoay màn hình
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
